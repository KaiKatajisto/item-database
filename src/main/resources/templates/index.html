<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <title>Item Database</title>
        <style>
            body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; }
            ul { list-style-type: none; padding: 0; }
            li { background: #f4f4f4; margin: 5px 0; padding: 10px; border-radius: 4px; }
            input[type="text"] { padding: 8px; width: 70%; }
            input[type="submit"] { padding: 8px; width: 25%; background: #28a745; color: white; border: none; cursor: pointer; }
        </style>
    </head>
    <body>

        <h1>Items list</h1>

        <ul>
            <li th:each="item : ${items}">
                <span th:text="${item.name}">Item Name</span>
            </li>
        </ul>

        <hr/>

        <h2>Add new item</h2>
        <form th:action="@{/}" method="POST">
            <input type="text" name="name" placeholder="Enter item name" required="required"/>
            <input type="submit" value="Add!"/>
        </form>
    </body>
</html>
