name: Java CI with Maven

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        maven: [ '3.9.8' ]

    name: Maven ${{ matrix.maven }} sample

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Maven Action
        uses: s4u/setup-maven-action@v1.19.0
        with:
          java-version: 11
          maven-version: ${{ matrix.maven }}

      - name: Run Tests (Blocking)        # Luodaan oma lohko testaukselle, niin se on helposti eroteltavissa. Uudelleen nimetty, koska nyt: continue-on-error: false.
        run: mvn test                     # Tämä laukaisee test\java\itemdatabase\ItemDatabaseTest.java:n.
        continue-on-error: false          # true: Tehdään testit, vaikka ne epäonnistuvat, jatketaan. (muista poistaa @Ignore ItemDatabaseTest.java:sta), MUUTIN false, koske testit onnistuvat.

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: kaimichaelkatajisto/item-database:latest

      - name: Deploy to CSC Server via SSH
        if: github.event_name != 'pull_request'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.CSC_HOST }}
          username: ${{ secrets.CSC_USERNAME }}
          key: ${{ secrets.CSC_SSH_KEY }}
          script: |
            # Siirry kansioon, jossa docker-compose.yml sijaitsee
            cd /home/ubuntu/itembase-harjoitus
            
            # Lataa uusin kuva Docker Hubista
            docker compose pull
            
            # Käynnistä kontit uudelleen uudella kuvalla
            docker compose up -d
            
            # (Valinnainen) Poista vanhat turhat imaget tilaa viemästä
            docker image prune -f